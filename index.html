    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwyVi8My5UYBC6azaOoBsk-uS9PmWd6gmAU-A0CADk2HlEHa3HIWJyas4vGc8Knb2hb/exec';

    function EduPortalApp() {
      // Configuration & Gas URL (Persisted in localStorage with your default URL)
      const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('eduportal_gas_url') || DEFAULT_GAS_URL);
      const [isSyncing, setIsSyncing] = useState(false);

      // Current Logged In User State: { role: 'admin'|'teacher'|'student', user: {...} }
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('eduportal_current_user');
          return saved ? JSON.parse(saved) : null;
        } catch {
          return null;
        }
      });

      // Active Database Tables State (Loaded from localStorage or Defaults)
      const [db, setDb] = useState(() => {
        try {
          const saved = localStorage.getItem('eduportal_db_cache');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error('Failed to load cache:', e);
        }
        return {
          Settings: INITIAL_SETTINGS,
          Teachers: INITIAL_TEACHERS,
          Students: INITIAL_STUDENTS,
          Courses: INITIAL_COURSES,
          Lessons: INITIAL_LESSONS,
          Assignments: INITIAL_ASSIGNMENTS,
          Submissions: INITIAL_SUBMISSIONS,
          Exams: INITIAL_EXAMS,
          ExamAttempts: INITIAL_EXAM_ATTEMPTS,
          Evaluations: INITIAL_EVALUATIONS
        };
      });

      // Save database cache to localStorage
      useEffect(() => {
        localStorage.setItem('eduportal_db_cache', JSON.stringify(db));
      }, [db]);

      // Save user session
      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('eduportal_current_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('eduportal_current_user');
        }
      }, [currentUser]);

      // Active View Routing for Dashboard
      const [currentTab, setCurrentTab] = useState('courses'); // 'courses', 'lessons', 'assignments', 'exams', 'evaluations', 'students', 'teachers', 'settings'
      const [selectedCourseId, setSelectedCourseId] = useState(null);
      const [takingExam, setTakingExam] = useState(null); // Active exam object when student starts an exam

      // Announcement Popup state
      const [showAnnouncement, setShowAnnouncement] = useState(false);

      // Parse current announcement
      const currentAnnouncement = useMemo(() => {
        const item = db.Settings?.find(s => s.SettingKey === 'Announcement');
        if (item && item.SettingValueJSON) {
          try {
            return JSON.parse(item.SettingValueJSON);
          } catch {
            return null;
          }
        }
        return null;
      }, [db.Settings]);

      // Trigger announcement popup on mount or user login once
      useEffect(() => {
        if (currentUser && currentAnnouncement && currentAnnouncement.enabled) {
          const hasSeen = sessionStorage.getItem('eduportal_seen_announcement');
          if (!hasSeen) {
            setShowAnnouncement(true);
            sessionStorage.setItem('eduportal_seen_announcement', 'true');
          }
        }
      }, [currentUser, currentAnnouncement]);

      const callGasApi = async (action, payload = {}) => {
        if (!gasUrl || !gasUrl.startsWith('https://script.google.com/')) {
          Swal.fire({
            icon: 'warning',
            title: 'ยังไม่ได้ระบุ GAS Web App URL',
            text: 'กรุณาใส่ Web App URL ของ Google Apps Script ในแถบตั้งค่าผู้ดูแลระบบก่อนเชื่อมต่อจริง',
            confirmButtonColor: '#4f46e5'
          });
          return null;
        }

        setIsSyncing(true);
        try {
          const response = await fetch(gasUrl, {
            method: 'POST',
            // Use text/plain to bypass GitHub Pages CORS Preflight
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, payload })
          });

          const data = await response.json();
          if (data.status === 'error') {
            throw new Error(data.message || 'API responded with error');
          }
          return data.result;
        } catch (error) {
          console.error('GAS API Call failed:', error);
          Swal.fire({
            icon: 'error',
            title: 'การเชื่อมต่อผิดพลาด',
            text: error.message || 'ไม่สามารถติดต่อ Google Apps Script ได้ กรุณาตรวจสอบสิทธิ์การแชร์ (Anyone)',
            confirmButtonColor: '#ef4444'
          });
          return null;
        } finally {
          setIsSyncing(false);
        }
      };

      // Control Panel Action Handlers
      const handlePingGAS = async () => {
        const res = await callGasApi('ping');
        if (res && res.success) {
          Swal.fire({
            icon: 'success',
            title: 'เชื่อมต่อสำเร็จ! (Online)',
            text: res.message || 'Google Apps Script Web App ตอบสนองปกติ',
            confirmButtonColor: '#4f46e5'
          });
        }
      };

      const handleSetupDatabase = async () => {
        const confirm = await Swal.fire({
          title: 'สร้างและจัดระเบียบ 10 ชีต?',
          text: 'ระบบจะสั่งให้ Code.gs ตรวจสอบและสร้าง 10 Sheet หลักพร้อมจัดหัวตารางอัตโนมัติบน Google Sheets',
          icon: 'question',
          showCancelButton: true,
          confirmButtonText: 'ยืนยันเริ่มสร้าง',
          cancelButtonText: 'ยกเลิก',
          confirmButtonColor: '#4f46e5'
        });

        if (confirm.isConfirmed) {
          const res = await callGasApi('setup');
          if (res && res.success) {
            Swal.fire({
              icon: 'success',
              title: 'สร้างตารางสำเร็จ!',
              text: res.message,
              confirmButtonColor: '#4f46e5'
            });
          }
        }
      };

      const handlePullData = async () => {
        const res = await callGasApi('pullAll');
        if (res && res.data) {
          // Merge newly received data into local DB
          setDb(prev => ({ ...prev, ...res.data }));
          Swal.fire({
            icon: 'success',
            title: 'ดึงข้อมูลสำเร็จ (Pull Complete)',
            text: 'ซิงค์ข้อมูลล่าสุดทั้ง 10 ตารางจาก Google Sheets สู่ระบบเรียบร้อย',
            timer: 2000,
            showConfirmButton: false
          });
        }
      };

      const handlePushData = async () => {
        const confirm = await Swal.fire({
          title: 'ส่งข้อมูลทั้งหมดขึ้น Sheets?',
          text: 'ข้อมูลปัจจุบันในระบบจะถูกส่งขึ้นไปเขียนบันทึกลงในชีตทั้งหมด',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'ใช่, ซิงค์ขึ้นคลาวด์',
          cancelButtonText: 'ยกเลิก',
          confirmButtonColor: '#4f46e5'
        });

        if (confirm.isConfirmed) {
          const res = await callGasApi('pushAll', db);
          if (res && res.success) {
            Swal.fire({
              icon: 'success',
              title: 'ส่งข้อมูลสำเร็จ (Push Complete)',
              text: 'อัปเดตข้อมูลขึ้น Google Sheets เรียบร้อยแล้ว',
              confirmButtonColor: '#4f46e5'
            });
          }
        }
      };

      // Save Single Record directly to Sheet (and update local state immediately)
      const saveRecordToSheet = async (sheetName, recordData) => {
        const idKey = sheetName === 'Students' ? 'StudentID' :
                      sheetName === 'Teachers' ? 'TeacherID' :
                      sheetName === 'Courses' ? 'CourseID' :
                      sheetName === 'Lessons' ? 'LessonID' :
                      sheetName === 'Assignments' ? 'AssignmentID' :
                      sheetName === 'Exams' ? 'ExamID' :
                      sheetName === 'ExamAttempts' ? 'AttemptID' :
                      sheetName === 'Settings' ? 'SettingKey' : 'ID';

        // Update local state first for instant UX
        setDb(prev => {
          const table = prev[sheetName] || [];
          const existingIndex = table.findIndex(item => item[idKey] === recordData[idKey]);
          let updatedTable;
          if (existingIndex >= 0) {
            updatedTable = [...table];
            updatedTable[existingIndex] = { ...updatedTable[existingIndex], ...recordData };
          } else {
            updatedTable = [...table, recordData];
          }
          return { ...prev, [sheetName]: updatedTable };
        });

        // Sync with GAS if URL configured
        if (gasUrl) {
          await callGasApi('saveRecord', { sheetName, data: recordData });
        }
      };

      // Delete Single Record
      const deleteRecordFromSheet = async (sheetName, primaryValue) => {
        const idKey = sheetName === 'Students' ? 'StudentID' :
                      sheetName === 'Teachers' ? 'TeacherID' :
                      sheetName === 'Courses' ? 'CourseID' :
                      sheetName === 'Lessons' ? 'LessonID' :
                      sheetName === 'Assignments' ? 'AssignmentID' :
                      sheetName === 'Exams' ? 'ExamID' :
                      sheetName === 'ExamAttempts' ? 'AttemptID' :
                      sheetName === 'Settings' ? 'SettingKey' : 'ID';

        setDb(prev => {
          const table = prev[sheetName] || [];
          const updatedTable = table.filter(item => item[idKey] !== primaryValue);
          return { ...prev, [sheetName]: updatedTable };
        });

        if (gasUrl) {
          await callGasApi('deleteRecord', { sheetName, primaryValue });
        }
      };

      const renderAnnouncementModal = () => {
        if (!showAnnouncement || !currentAnnouncement) return null;
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
            <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-100 overflow-hidden transform transition-all p-6 text-center">
              <div className="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <Icon name="Bell" size={32} />
              </div>
              <span className="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 font-semibold text-xs rounded-full mb-3">
                {currentAnnouncement.badge || 'ประกาศสำคัญ'}
              </span>
              <h3 className="text-xl font-bold text-slate-800 mb-2">{currentAnnouncement.title}</h3>
              <p className="text-slate-600 text-sm leading-relaxed mb-6 whitespace-pre-line text-left bg-slate-50 p-4 rounded-xl border border-slate-100">
                {currentAnnouncement.content}
              </p>
              <button
                onClick={() => setShowAnnouncement(false)}
                className="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition duration-200 shadow-sm"
              >
                รับทราบและเริ่มใช้งาน
              </button>
            </div>
          </div>
        );
      };

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-slate-900 to-slate-950 flex flex-col items-center justify-center p-4">
            <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
              <div className="text-center mb-8">
                <div className="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white mx-auto shadow-lg shadow-indigo-500/30 mb-4">
                  <Icon name="GraduationCap" size={36} />
                </div>
                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">EduPortal LMS</h1>
                <p className="text-slate-500 text-sm mt-1">ระบบจัดการเรียนการสอนออนไลน์สำหรับโรงเรียน</p>
              </div>

              <LoginForm 
                db={db} 
                onLogin={(role, user) => setCurrentUser({ role, user })} 
              />
            </div>
            
            <p className="text-slate-400 text-xs mt-6 text-center">
              Powered by Google Apps Script + Google Sheets & GitHub Pages
            </p>
          </div>
        );
      }

      const visibleCourses = useMemo(() => {
        if (currentUser.role === 'admin') return db.Courses || [];
        if (currentUser.role === 'teacher') {
          return (db.Courses || []).filter(c => c.TeacherID === currentUser.user.TeacherID);
        }
        if (currentUser.role === 'student') {
          const allowedList = (currentUser.user.AllowedCourses || '').split(',').map(s => s.trim());
          return (db.Courses || []).filter(c => allowedList.includes(c.CourseID));
        }
        return [];
      }, [currentUser, db.Courses]);

      const activeCourse = useMemo(() => {
        return (db.Courses || []).find(c => c.CourseID === selectedCourseId) || visibleCourses[0] || null;
      }, [db.Courses, visibleCourses, selectedCourseId]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {renderAnnouncementModal()}

          {/* Top Admin-Only Database Control Panel */}
          {currentUser.role === 'admin' && (
            <AdminControlBar 
              gasUrl={gasUrl}
              setGasUrl={(url) => {
                setGasUrl(url);
                localStorage.setItem('eduportal_gas_url', url);
              }}
              isSyncing={isSyncing}
              onPing={handlePingGAS}
              onSetup={handleSetupDatabase}
              onPull={handlePullData}
              onPush={handlePushData}
            />
          )}

          {/* Navigation Bar */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-600/20">
                  <Icon name="GraduationCap" size={24} />
                </div>
                <div>
                  <span className="font-bold text-lg text-slate-900 tracking-tight block leading-tight">EduPortal</span>
                  <span className="text-[11px] text-slate-500 font-medium">Smart Online LMS</span>
                </div>
              </div>

              {/* User Identity Info */}
              <div className="flex items-center gap-3">
                <div className="text-right hidden sm:block">
                  <div className="text-sm font-semibold text-slate-800 leading-tight">
                    {currentUser.role === 'admin' ? 'ผู้ดูแลระบบ (Admin)' : currentUser.user.Name}
                  </div>
                  <div className="text-xs text-indigo-600 font-medium">
                    {currentUser.role === 'admin' && 'System Administrator'}
                    {currentUser.role === 'teacher' && `ครูผู้สอน • ${currentUser.user.Department || 'วิชาการ'}`}
                    {currentUser.role === 'student' && `รหัสนักเรียน: ${currentUser.user.StudentID} (${currentUser.user.Grade})`}
                  </div>
                </div>

                <div className="w-10 h-10 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center font-bold border border-slate-200">
                  {currentUser.role === 'admin' ? <Icon name="Shield" size={20} className="text-indigo-600" /> :
                   currentUser.role === 'teacher' ? <Icon name="BookOpen" size={20} className="text-emerald-600" /> :
                   <Icon name="GraduationCap" size={20} className="text-amber-600" />}
                </div>

                <button
                  onClick={() => {
                    Swal.fire({
                      title: 'ออกจากระบบ?',
                      text: 'คุณต้องการออกจากระบบ EduPortal หรือไม่',
                      icon: 'question',
                      showCancelButton: true,
                      confirmButtonText: 'ออกจากระบบ',
                      cancelButtonText: 'ยกเลิก',
                      confirmButtonColor: '#ef4444'
                    }).then(res => {
                      if (res.isConfirmed) {
                        setCurrentUser(null);
                        setSelectedCourseId(null);
                        setTakingExam(null);
                      }
                    });
                  }}
                  className="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                  title="ออกจากระบบ"
                >
                  <Icon name="LogOut" size={20} />
                </button>
              </div>
            </div>
          </header>

          {/* Main Dashboard Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {takingExam ? (
              <ExamTakingView 
                exam={takingExam}
                student={currentUser.user}
                onComplete={async (resultRecord) => {
                  await saveRecordToSheet('ExamAttempts', resultRecord);
                  setTakingExam(null);
                  setCurrentTab('exams');
                  Swal.fire({
                    icon: 'success',
                    title: 'ส่งคำตอบเรียบร้อย!',
                    html: `คะแนนของคุณคือ <b>${resultRecord.Score} / ${resultRecord.TotalScore}</b> คะแนน`,
                    confirmButtonColor: '#4f46e5'
                  });
                }}
                onCancel={() => setTakingExam(null)}
              />
            ) : (
              <div>
                {/* Navigation Tabs based on Role */}
                <div className="flex border-b border-slate-200 mb-6 gap-2 overflow-x-auto pb-1">
                  <TabButton active={currentTab === 'courses'} onClick={() => setCurrentTab('courses')} icon="BookOpen" label="รายวิชาเรียน" />
                  {activeCourse && (
                    <>
                      <TabButton active={currentTab === 'lessons'} onClick={() => setCurrentTab('lessons')} icon="Video" label="บทเรียน & สื่อ" />
                      <TabButton active={currentTab === 'assignments'} onClick={() => setCurrentTab('assignments')} icon="FileText" label="การบ้าน & งาน" />
                      <TabButton active={currentTab === 'exams'} onClick={() => setCurrentTab('exams')} icon="Clock" label="แบบทดสอบออนไลน์" />
                      <TabButton active={currentTab === 'evaluations'} onClick={() => setCurrentTab('evaluations')} icon="Star" label="แบบประเมินครู" />
                    </>
                  )}
                  {currentUser.role === 'admin' && (
                    <>
                      <TabButton active={currentTab === 'students'} onClick={() => setCurrentTab('students')} icon="Users" label="จัดการนักเรียน (CSV)" />
                      <TabButton active={currentTab === 'teachers'} onClick={() => setCurrentTab('teachers')} icon="UserCheck" label="จัดการครูผู้สอน" />
                      <TabButton active={currentTab === 'settings'} onClick={() => setCurrentTab('settings')} icon="Bell" label="ตั้งค่าประกาศ" />
                    </>
                  )}
                </div>

                {/* Tab Views Router */}
                {currentTab === 'courses' && (
                  <CoursesView 
                    courses={visibleCourses} 
                    allTeachers={db.Teachers || []}
                    currentUser={currentUser} 
                    selectedCourseId={activeCourse?.CourseID}
                    onSelectCourse={(id) => {
                      setSelectedCourseId(id);
                      setCurrentTab('lessons');
                    }}
                    onSaveCourse={(c) => saveRecordToSheet('Courses', c)}
                    onDeleteCourse={(id) => deleteRecordFromSheet('Courses', id)}
                  />
                )}

                {currentTab === 'lessons' && activeCourse && (
                  <LessonsView 
                    course={activeCourse} 
                    lessons={(db.Lessons || []).filter(l => l.CourseID === activeCourse.CourseID)}
                    currentUser={currentUser}
                    onSaveLesson={(lesson) => saveRecordToSheet('Lessons', lesson)}
                    onDeleteLesson={(id) => deleteRecordFromSheet('Lessons', id)}
                  />
                )}

                {currentTab === 'assignments' && activeCourse && (
                  <AssignmentsView 
                    course={activeCourse}
                    assignments={(db.Assignments || []).filter(a => a.CourseID === activeCourse.CourseID)}
                    submissions={(db.Submissions || []).filter(s => s.CourseID === activeCourse.CourseID)}
                    currentUser={currentUser}
                    gasUrl={gasUrl}
                    callGasApi={callGasApi}
                    onSaveAssignment={(a) => saveRecordToSheet('Assignments', a)}
                    onDeleteAssignment={(id) => deleteRecordFromSheet('Assignments', id)}
                    onSaveSubmission={(s) => saveRecordToSheet('Submissions', s)}
                  />
                )}

                {currentTab === 'exams' && activeCourse && (
                  <ExamsView 
                    course={activeCourse}
                    exams={(db.Exams || []).filter(e => e.CourseID === activeCourse.CourseID)}
                    attempts={(db.ExamAttempts || []).filter(att => att.CourseID === activeCourse.CourseID)}
                    currentUser={currentUser}
                    onStartExam={(exam) => setTakingExam(exam)}
                    onSaveExam={(exam) => saveRecordToSheet('Exams', exam)}
                    onDeleteExam={(id) => deleteRecordFromSheet('Exams', id)}
                  />
                )}

                {currentTab === 'evaluations' && activeCourse && (
                  <EvaluationsView 
                    course={activeCourse}
                    evaluations={(db.Evaluations || []).filter(ev => ev.CourseID === activeCourse.CourseID)}
                    currentUser={currentUser}
                    onSaveEvaluation={(ev) => saveRecordToSheet('Evaluations', ev)}
                  />
                )}

                {currentTab === 'students' && currentUser.role === 'admin' && (
                  <StudentsManagementView 
                    students={db.Students || []}
                    courses={db.Courses || []}
                    gasUrl={gasUrl}
                    callGasApi={callGasApi}
                    onSaveStudent={(st) => saveRecordToSheet('Students', st)}
                    onDeleteStudent={(id) => deleteRecordFromSheet('Students', id)}
                    onBatchImportSuccess={(newStudents) => {
                      setDb(prev => ({
                        ...prev,
                        Students: [...(prev.Students || []).filter(s => !newStudents.some(ns => ns.StudentID === s.StudentID)), ...newStudents]
                      }));
                    }}
                  />
                )}

                {currentTab === 'teachers' && currentUser.role === 'admin' && (
                  <TeachersManagementView 
                    teachers={db.Teachers || []}
                    onSaveTeacher={(t) => saveRecordToSheet('Teachers', t)}
                    onDeleteTeacher={(id) => deleteRecordFromSheet('Teachers', id)}
                  />
                )}

                {currentTab === 'settings' && currentUser.role === 'admin' && (
                  <SettingsView 
                    settings={db.Settings || []}
                    onSaveSetting={(st) => saveRecordToSheet('Settings', st)}
                  />
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    function TabButton({ active, onClick, icon, label }) {
      return (
        <button
          onClick={onClick}
          className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm transition whitespace-nowrap ${
            active 
              ? 'bg-indigo-600 text-white shadow-sm' 
              : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
          }`}
        >
          <Icon name={icon} size={18} />
          <span>{label}</span>
        </button>
      );
    }

    function AdminControlBar({ gasUrl, setGasUrl, isSyncing, onPing, onSetup, onPull, onPush }) {
      const [isOpen, setIsOpen] = useState(false);
      const [localUrl, setLocalUrl] = useState(gasUrl);

      return (
        <div className="bg-slate-900 text-white border-b border-slate-800 text-xs">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
              <span className="font-semibold text-slate-200">แผงควบคุมฐานข้อมูล (Admin Backend Control)</span>
              <span className="text-slate-400">| Google Apps Script Primary DB</span>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={() => setIsOpen(!isOpen)}
                className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md border border-slate-700 transition flex items-center gap-1.5"
              >
                <Icon name="Database" size={14} />
                <span>{isOpen ? 'ปิดช่องตั้งค่า URL' : 'ตั้งค่า Web App URL'}</span>
              </button>

              <button
                onClick={onPing}
                disabled={isSyncing}
                className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-md transition flex items-center gap-1"
                title="ทดสอบยิง Ping ไปยัง GAS"
              >
                <Icon name="RefreshCw" size={14} className={isSyncing ? "animate-spin" : ""} />
                <span>Ping Test</span>
              </button>

              <button
                onClick={onSetup}
                disabled={isSyncing}
                className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded-md border border-amber-900/40 transition flex items-center gap-1"
                title="สั่งให้ Code.gs สร้างทั้ง 10 ตารางบน Google Sheets"
              >
                <Icon name="Database" size={14} />
                <span>สร้าง 10 Sheet</span>
              </button>

              <button
                onClick={onPull}
                disabled={isSyncing}
                className="px-2.5 py-1 bg-sky-600 hover:bg-sky-500 text-white rounded-md transition flex items-center gap-1"
                title="ดึงข้อมูลล่าสุดทั้งหมดจาก Sheets สู่ระบบ"
              >
                <Icon name="DownloadCloud" size={14} />
                <span>ดึงจาก Sheets (Pull)</span>
              </button>

              <button
                onClick={onPush}
                disabled={isSyncing}
                className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-md transition flex items-center gap-1"
                title="ส่งข้อมูลทั้งหมดในระบบขึ้น Sheets"
              >
                <Icon name="UploadCloud" size={14} />
                <span>ส่งขึ้น Sheets (Push)</span>
              </button>
            </div>
          </div>

          {isOpen && (
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 border-t border-slate-800 bg-slate-950/50 flex flex-col sm:flex-row items-center gap-2">
              <input
                type="text"
                placeholder="วาง Google Apps Script Web App URL ที่นี่ (https://script.google.com/macros/s/.../exec)"
                value={localUrl}
                onChange={(e) => setLocalUrl(e.target.value)}
                className="flex-1 w-full bg-slate-900 text-slate-100 text-xs px-3 py-1.5 rounded border border-slate-700 focus:outline-hidden focus:border-indigo-500"
              />
              <button
                onClick={() => {
                  setGasUrl(localUrl);
                  Swal.fire({
                    icon: 'success',
                    title: 'บันทึก URL สำเร็จ',
                    timer: 1500,
                    showConfirmButton: false
                  });
                }}
                className="w-full sm:w-auto px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded transition"
              >
                บันทึก URL
              </button>
            </div>
          )}
        </div>
      );
    }

    function LoginForm({ db, onLogin }) {
      const [role, setRole] = useState('student'); // 'student', 'teacher', 'admin'
      
      // Fields
      const [studentId, setStudentId] = useState('');
      const [pin, setPin] = useState('');
      const [teacherEmail, setTeacherEmail] = useState('');
      const [teacherPassword, setTeacherPassword] = useState('');
      const [adminPassword, setAdminPassword] = useState('');

      const handleLoginSubmit = (e) => {
        e.preventDefault();

        if (role === 'student') {
          const student = (db.Students || []).find(s => s.StudentID === studentId.trim());
          if (!student) {
            Swal.fire({ icon: 'error', title: 'ไม่พบรหัสนักเรียน', text: 'โปรดตรวจสอบรหัสนักเรียนอีกครั้ง', confirmButtonColor: '#ef4444' });
            return;
          }
          if (student.PIN && student.PIN !== pin.trim()) {
            Swal.fire({ icon: 'error', title: 'รหัสผ่าน/PIN ไม่ถูกต้อง', confirmButtonColor: '#ef4444' });
            return;
          }
          onLogin('student', student);
        } else if (role === 'teacher') {
          const teacher = (db.Teachers || []).find(t => t.Email.toLowerCase() === teacherEmail.trim().toLowerCase());
          if (!teacher || teacher.Password !== teacherPassword) {
            Swal.fire({ icon: 'error', title: 'อีเมลหรือรหัสผ่านครูไม่ถูกต้อง', confirmButtonColor: '#ef4444' });
            return;
          }
          onLogin('teacher', teacher);
        } else if (role === 'admin') {
          // Check Admin password in Settings or fallback
          const adminSetting = (db.Settings || []).find(s => s.SettingKey === 'AdminPassword');
          let validPass = 'admin1234';
          if (adminSetting && adminSetting.SettingValueJSON) {
            try {
              validPass = JSON.parse(adminSetting.SettingValueJSON);
            } catch {
              validPass = adminSetting.SettingValueJSON;
            }
          }

          if (adminPassword !== validPass) {
            Swal.fire({ icon: 'error', title: 'รหัสผ่านผู้ดูแลระบบไม่ถูกต้อง', text: 'รหัสผ่านเริ่มต้นคือ admin1234', confirmButtonColor: '#ef4444' });
            return;
          }
          onLogin('admin', { Name: 'ผู้ดูแลระบบสูงสุด', Role: 'Admin' });
        }
      };

      return (
        <div>
          {/* Role selector tabs */}
          <div className="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-2xl mb-6">
            <button
              type="button"
              onClick={() => setRole('student')}
              className={`py-2 text-xs font-semibold rounded-xl transition ${role === 'student' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
            >
              นักเรียน
            </button>
            <button
              type="button"
              onClick={() => setRole('teacher')}
              className={`py-2 text-xs font-semibold rounded-xl transition ${role === 'teacher' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
            >
              ครูผู้สอน
            </button>
            <button
              type="button"
              onClick={() => setRole('admin')}
              className={`py-2 text-xs font-semibold rounded-xl transition ${role === 'admin' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
            >
              ผู้ดูแลระบบ
            </button>
          </div>

          <form onSubmit={handleLoginSubmit} className="space-y-4">
            {role === 'student' && (
              <>
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">รหัสนักเรียน (StudentID)</label>
                  <input
                    type="text"
                    required
                    placeholder="เช่น 04501"
                    value={studentId}
                    onChange={(e) => setStudentId(e.target.value)}
                    className="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-hidden focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">รหัสผ่าน / PIN (4 หลัก)</label>

    function AssignmentsView({ course, assignments, submissions, currentUser, gasUrl, callGasApi, onSaveAssignment, onDeleteAssignment, onSaveSubmission }) {
      const [uploadingAssignmentId, setUploadingAssignmentId] = useState(null);
      const fileInputRef = useRef(null);

      const handleCreateAssignment = async () => {
        const { value: formValues } = await Swal.fire({
          title: 'มอบหมายงานใหม่',
          html: `
            <div class="text-left space-y-2 text-xs">
              <label class="font-bold text-slate-700">ชื่องาน / ใบงาน</label>
              <input id="swal-assign-title" class="w-full p-2 border rounded-lg" placeholder="เช่น ใบงานที่ 1: ผังงาน">
              <label class="font-bold text-slate-700">คำสั่งและรายละเอียด</label>
              <textarea id="swal-assign-desc" class="w-full p-2 border rounded-lg h-20" placeholder="อธิบายคำสั่ง กำหนดประเภทไฟล์..."></textarea>
              <label class="font-bold text-slate-700">คะแนนเต็ม</label>
              <input id="swal-assign-score" type="number" class="w-full p-2 border rounded-lg" value="10">
              <label class="font-bold text-slate-700">วันกำหนดส่ง (Due Date)</label>
              <input id="swal-assign-due" type="datetime-local" class="w-full p-2 border rounded-lg">
            </div>
          `,
          showCancelButton: true,
          confirmButtonColor: '#4f46e5',
          preConfirm: () => {
            const title = document.getElementById('swal-assign-title').value;
            const description = document.getElementById('swal-assign-desc').value;
            const maxScore = document.getElementById('swal-assign-score').value;
            const dueDate = document.getElementById('swal-assign-due').value;
            if (!title) {
              Swal.showValidationMessage('กรุณากรอกชื่องาน');
              return false;
            }
            return { title, description, maxScore, dueDate };
          }
        });

        if (formValues) {
          const newAssignment = {
            AssignmentID: 'ASN_' + Date.now().toString().slice(-6),
            CourseID: course.CourseID,
            Title: formValues.title,
            Description: formValues.description,
            MaxScore: formValues.maxScore || '10',
            DueDate: formValues.dueDate || '',
            AttachmentsJSON: '[]',
            CreatedAt: new Date().toISOString()
          };
          onSaveAssignment(newAssignment);
          Swal.fire({ icon: 'success', title: 'สร้างใบงานสำเร็จ', timer: 1500, showConfirmButton: false });
        }
      };

      // Student File Upload to Google Drive via GAS Base64
      const handleFileUpload = (assignment) => {
        setUploadingAssignmentId(assignment.AssignmentID);
        if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      const processFileSelection = async (e) => {
        const file = e.target.files[0];
        if (!file || !uploadingAssignmentId) return;

        // Size check (15MB limit)
        if (file.size > 15 * 1024 * 1024) {
          Swal.fire({ icon: 'error', title: 'ไฟล์มีขนาดใหญ่เกินไป', text: 'กรุณาอัปโหลดไฟล์ขนาดไม่เกิน 15 MB' });
          return;
        }

        Swal.fire({
          title: 'กำลังอัปโหลดไฟล์ส่งงาน...',
          text: 'ระบบกำลังแปลงไฟล์และส่งเข้า Google Drive ผ่าน Google Apps Script',
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          }
        });

        const reader = new FileReader();
        reader.onload = async () => {
          const base64Data = reader.result;
          
          let fileUrl = 'https://drive.google.com/mock-file-view';
          let driveFileId = 'MOCK_ID_' + Date.now();

          // If GAS URL is configured, push file to actual Drive
          if (gasUrl) {
            const uploadRes = await callGasApi('uploadFile', {
              base64Data: base64Data,
              fileName: `${currentUser.user.StudentID}_${file.name}`,
              mimeType: file.type
            });

            if (uploadRes && uploadRes.success) {
              fileUrl = uploadRes.fileUrl;
              driveFileId = uploadRes.driveFileId;
            }
          }

          const submissionRecord = {
            ID: 'SUB_' + Date.now().toString().slice(-6),
            AssignmentID: uploadingAssignmentId,
            CourseID: course.CourseID,
            StudentID: currentUser.user.StudentID,
            StudentName: currentUser.user.Name,
            Grade: currentUser.user.Grade || '',
            FileName: file.name,
            FileUrl: fileUrl,
            DriveFileID: driveFileId,
            Note: 'ส่งงานผ่านระบบ EduPortal',
            SubmittedAt: new Date().toLocaleString('th-TH'),
            Score: '',
            Feedback: '',
            Status: 'Submitted'
          };

          await onSaveSubmission(submissionRecord);
          Swal.fire({
            icon: 'success',
            title: 'ส่งงานเรียบร้อย!',
            text: 'ไฟล์ของคุณถูกบันทึกเข้า Google Drive และตาราง Submissions เรียบร้อยแล้ว',
            confirmButtonColor: '#4f46e5'
          });
          setUploadingAssignmentId(null);
        };
        reader.readAsDataURL(file);
      };

      // Teacher Grading Modal
      const handleGradeSubmission = async (sub, maxScore) => {
        const { value: formValues } = await Swal.fire({
          title: `ตรวจงาน: ${sub.StudentName}`,
          html: `
            <div class="text-left space-y-2 text-xs">
              <p><strong>ไฟล์งาน:</strong> <a href="${sub.FileUrl}" target="_blank" class="text-indigo-600 underline">${sub.FileName}</a></p>
              <label class="font-bold text-slate-700">ให้คะแนน (เต็ม ${maxScore})</label>
              <input id="swal-grade-score" type="number" step="0.5" max="${maxScore}" class="w-full p-2 border rounded-lg" value="${sub.Score || ''}">
              <label class="font-bold text-slate-700">ข้อเสนอแนะ / คำติชม</label>
              <textarea id="swal-grade-fb" class="w-full p-2 border rounded-lg h-20">${sub.Feedback || ''}</textarea>
            </div>
          `,
          showCancelButton: true,
          confirmButtonColor: '#4f46e5',
          preConfirm: () => {
            const score = document.getElementById('swal-grade-score').value;
            const feedback = document.getElementById('swal-grade-fb').value;
            return { score, feedback };
          }
        });

        if (formValues) {
          const updated = {
            ...sub,
            Score: formValues.score,
            Feedback: formValues.feedback,
            Status: 'Graded'
          };
          onSaveSubmission(updated);

    function ExamTakingView({ exam, student, onComplete, onCancel }) {
      const questions = useMemo(() => {
        try {
          return JSON.parse(exam.QuestionsJSON || '[]');
        } catch {
          return [];
        }
      }, [exam.QuestionsJSON]);

      const [answers, setAnswers] = useState({});
      const [secondsLeft, setSecondsLeft] = useState((parseInt(exam.TimeLimitMin) || 10) * 60);

      // Submit Calculation
      const handleSubmit = () => {
        let score = 0;
        let totalScore = 0;

        questions.forEach((q, idx) => {
          const qScore = parseInt(q.score) || 5;
          totalScore += qScore;
          if (answers[idx] === q.answerIndex) {
            score += qScore;
          }
        });

        const attemptRecord = {
          AttemptID: 'ATT_' + Date.now().toString().slice(-6),
          ExamID: exam.ExamID,
          CourseID: exam.CourseID,
          StudentID: student.StudentID,
          StudentName: student.Name,
          Score: String(score),
          TotalScore: String(totalScore),
          SubmittedAt: new Date().toLocaleString('th-TH'),
          TimeSpentSec: String(((parseInt(exam.TimeLimitMin) || 10) * 60) - secondsLeft)
        };

        onComplete(attemptRecord);
      };

      // Timer countdown effect
      useEffect(() => {
        if (secondsLeft <= 0) {
          Swal.fire({
            icon: 'info',
            title: 'หมดเวลาทำข้อสอบ!',
            text: 'ระบบกำลังส่งคำตอบของคุณโดยอัตโนมัติ',
            timer: 2000,
            showConfirmButton: false
          }).then(() => {
            handleSubmit();
          });
          return;
        }

        const timer = setInterval(() => {
          setSecondsLeft(prev => prev - 1);
        }, 1000);

        return () => clearInterval(timer);
      }, [secondsLeft]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      return (
        <div className="max-w-3xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-md">
          {/* Header & Sticky Timer */}
          <div className="flex items-center justify-between pb-6 border-b border-slate-100 mb-6">
            <div>
              <span className="text-xs font-semibold text-indigo-600 uppercase tracking-wider">กำลังทำข้อสอบ</span>
              <h2 className="text-xl font-bold text-slate-900">{exam.Title}</h2>
            </div>
            <div className={`flex items-center gap-2 px-4 py-2 rounded-2xl font-mono text-sm font-bold shadow-xs ${
              secondsLeft < 120 ? 'bg-rose-50 text-rose-600 animate-pulse border border-rose-200' : 'bg-slate-100 text-slate-800'
            }`}>
              <Icon name="Clock" size={18} />
              <span>{formatTime(secondsLeft)}</span>
            </div>
          </div>

          {/* Question List */}
          <div className="space-y-8">
            {questions.map((q, qIdx) => (
              <div key={q.id || qIdx} className="space-y-3">
                <h3 className="font-bold text-slate-800 text-sm flex gap-2">
                  <span className="text-indigo-600 font-extrabold">{qIdx + 1}.</span>
                  <span>{q.text}</span>
                </h3>

                <div className="space-y-2 pl-6">
                  {q.options.map((opt, optIdx) => (
                    <label
                      key={optIdx}
                      className={`flex items-center gap-3 p-3 rounded-xl border text-xs font-medium cursor-pointer transition ${
                        answers[qIdx] === optIdx 
                          ? 'bg-indigo-50/80 border-indigo-500 text-indigo-900 shadow-xs' 
                          : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                      }`}
                    >
                      <input
                        type="radio"
                        name={`question_${qIdx}`}
                        checked={answers[qIdx] === optIdx}
                        onChange={() => setAnswers({ ...answers, [qIdx]: optIdx })}
                        className="text-indigo-600 focus:ring-indigo-500"
                      />
                      <span>{opt}</span>
                    </label>
                  ))}
                </div>
              </div>
            ))}
          </div>

          {/* Footer Submit Bar */}
          <div className="mt-10 pt-6 border-t border-slate-100 flex items-center justify-between">
            <button
              onClick={() => {
                Swal.fire({
                  title: 'ต้องการออกจากการสอบ?',
                  text: 'คำตอบที่ทำไว้จะไม่ถูกบันทึก',
                  icon: 'warning',
                  showCancelButton: true,
                  confirmButtonColor: '#ef4444'
                }).then(res => {
                  if (res.isConfirmed) onCancel();
                });
              }}
              className="text-xs text-slate-500 hover:text-slate-800"
            >
              ยกเลิก
            </button>

            <button
              onClick={() => {
                Swal.fire({
                  title: 'ยืนยันส่งกระดาษคำตอบ?',
                  text: `คุณตอบไปแล้ว ${Object.keys(answers).length} จาก ${questions.length} ข้อ`,
                  icon: 'question',
                  showCancelButton: true,
                  confirmButtonText: 'ยืนยันส่งคำตอบ',
                  cancelButtonText: 'กลับไปตรวจทาน',
                  confirmButtonColor: '#4f46e5'
                }).then(res => {
                  if (res.isConfirmed) handleSubmit();
                });
              }}
              className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-md transition"
            >
              ส่งกระดาษคำตอบ
            </button>
          </div>
        </div>
      );
    }

    function StudentsManagementView({ students, courses, gasUrl, callGasApi, onSaveStudent, onDeleteStudent, onBatchImportSuccess }) {
      const [filter, setFilter] = useState('');
      const csvInputRef = useRef(null);

      const filtered = useMemo(() => {
        return students.filter(s => 
          (s.StudentID || '').includes(filter) || 
          (s.Name || '').toLowerCase().includes(filter.toLowerCase()) ||
          (s.Grade || '').toLowerCase().includes(filter.toLowerCase())
        );
      }, [students, filter]);

      // Add Single Student Modal
      const handleAddStudent = async () => {
        const { value: formValues } = await Swal.fire({
          title: 'เพิ่มนักเรียนเดี่ยว',
          html: `
            <div class="text-left space-y-2 text-xs">
              <label class="font-bold text-slate-700">รหัสนักเรียน (StudentID)</label>
              <input id="swal-st-id" class="w-full p-2 border rounded-lg" placeholder="เช่น 04505">
              <label class="font-bold text-slate-700">รหัส PIN (สำหรับ Login)</label>
              <input id="swal-st-pin" class="w-full p-2 border rounded-lg" value="1234">
              <label class="font-bold text-slate-700">ชื่อ-นามสกุล</label>
              <input id="swal-st-name" class="w-full p-2 border rounded-lg" placeholder="เช่น ด.ช. รักเรียน ขยันดี">
              <label class="font-bold text-slate-700">อีเมล (Optional - ว่างได้)</label>
              <input id="swal-st-email" type="email" class="w-full p-2 border rounded-lg" placeholder="student@school.ac.th">
              <label class="font-bold text-slate-700">ระดับชั้น</label>
              <input id="swal-st-grade" class="w-full p-2 border rounded-lg" placeholder="เช่น ม.3/1">
              <label class="font-bold text-slate-700">รหัสวิชาที่ลงทะเบียน (คั่นด้วยจุลภาค)</label>
              <input id="swal-st-courses" class="w-full p-2 border rounded-lg" placeholder="เช่น C101,C102">
            </div>
          `,
          showCancelButton: true,
          confirmButtonColor: '#4f46e5',
          preConfirm: () => {
            const studentId = document.getElementById('swal-st-id').value;
            const pin = document.getElementById('swal-st-pin').value;
            const name = document.getElementById('swal-st-name').value;
            const email = document.getElementById('swal-st-email').value;
            const grade = document.getElementById('swal-st-grade').value;
            const allowed = document.getElementById('swal-st-courses').value;
            if (!studentId || !name) {
              Swal.showValidationMessage('กรุณากรอกรหัสนักเรียนและชื่อ');
              return false;
            }
            return { studentId, pin, name, email, grade, allowed };
          }
        });

        if (formValues) {
          const newStudent = {
            ID: 'ST_' + Date.now().toString().slice(-6),
            StudentID: formValues.studentId,
            PIN: formValues.pin || '1234',
            Name: formValues.name,
            Email: formValues.email || '',
            Grade: formValues.grade,
            AllowedCourses: formValues.allowed,
            CreatedAt: new Date().toISOString().split('T')[0]
          };
          onSaveStudent(newStudent);
          Swal.fire({ icon: 'success', title: 'เพิ่มนักเรียนสำเร็จ', timer: 1200, showConfirmButton: false });
        }
      };

      // High Performance Chunked CSV Import
      const handleCsvUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (evt) => {
          const text = evt.target.result;
          const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
          if (lines.length <= 1) {
            Swal.fire({ icon: 'warning', title: 'ไฟล์ว่างเปล่าหรือไม่มีข้อมูล' });
            return;
          }

          const parsedStudents = [];
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',').map(s => s.trim().replace(/^["']|["']$/g, ''));
            if (cols.length >= 2 && cols[0]) {
              parsedStudents.push({
                ID: 'ST_' + Date.now().toString().slice(-4) + '_' + i,
                StudentID: cols[0],
                PIN: cols[1] || '1234',
                Name: cols[2] || 'นักเรียน',
                Email: cols[3] || '',
                Grade: cols[4] || '',
                AllowedCourses: cols[5] || '',
                CreatedAt: new Date().toISOString().split('T')[0]
              });
            }
          }

          if (parsedStudents.length === 0) {
            Swal.fire({ icon: 'error', title: 'ไม่สามารถอ่านข้อมูล CSV ได้' });
            return;
          }

          // Chunking into groups of 50 to avoid GAS script timeout
          const CHUNK_SIZE = 50;
          const totalChunks = Math.ceil(parsedStudents.length / CHUNK_SIZE);

          Swal.fire({
            title: `กำลังนำเข้า ${parsedStudents.length} คน...`,
            html: `ประมวลผล Chunk <b>1 / ${totalChunks}</b>`,
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
          });

          for (let c = 0; c < totalChunks; c++) {
            const chunk = parsedStudents.slice(c * CHUNK_SIZE, (c + 1) * CHUNK_SIZE);
            if (gasUrl) {
              await callGasApi('batchSave', { sheetName: 'Students', records: chunk });
            }
            if (Swal.getPopup()) {
              Swal.getPopup().querySelector('b').textContent = `${c + 1} / ${totalChunks}`;
            }
          }

          onBatchImportSuccess(parsedStudents);
          Swal.fire({
            icon: 'success',
            title: 'นำเข้าข้อมูล CSV สำเร็จ!',
            text: `บันทึกข้อมูลนักเรียนทั้งหมด ${parsedStudents.length} คนเรียบร้อยแล้ว`,
            confirmButtonColor: '#4f46e5'
          });
        };
        reader.readAsText(file);
      };

      return (
        <div className="space-y-6">
          <input type="file" ref={csvInputRef} accept=".csv" onChange={handleCsvUpload} className="hidden" />

          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-bold text-slate-900">จัดการข้อมูลนักเรียน (Students Management)</h2>
              <p className="text-xs text-slate-500 mt-0.5">รองรับการนำเข้าจำนวนมากด้วยเทคนิค CSV Chunking</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => csvInputRef.current && csvInputRef.current.click()}
                className="inline-flex items-center gap-2 px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl transition shadow-sm"
              >
                <Icon name="FileSpreadsheet" size={16} />
                <span>นำเข้าไฟล์ CSV</span>
              </button>
              <button
                onClick={handleAddStudent}
                className="inline-flex items-center gap-2 px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl transition shadow-sm"
              >
                <Icon name="Plus" size={16} />
                <span>เพิ่มนักเรียน</span>
              </button>
            </div>
          </div>

          <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
              <input
                type="text"
                placeholder="ค้นหาด้วยรหัสนักเรียน, ชื่อ หรือชั้นเรียน..."
                value={filter}
                onChange={(e) => setFilter(e.target.value)}
                className="w-full sm:w-72 px-3.5 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-hidden focus:border-indigo-500"
              />
              <span className="text-xs text-slate-500 font-medium">ทั้งหมด {filtered.length} คน</span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-slate-200 text-slate-500">
                    <th className="py-2.5">รหัส (StudentID)</th>
                    <th className="py-2.5">PIN</th>
                    <th className="py-2.5">ชื่อ-นามสกุล</th>
                    <th className="py-2.5">ระดับชั้น</th>
                    <th className="py-2.5">อีเมล</th>
                    <th className="py-2.5">สิทธิ์วิชาเรียน</th>
                    <th className="py-2.5 text-right">จัดการ</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filtered.map(st => (
                    <tr key={st.StudentID} className="hover:bg-slate-50/70">
                      <td className="py-3 font-bold text-indigo-600">{st.StudentID}</td>
                      <td className="py-3 text-slate-600 font-mono">{st.PIN}</td>

                      <td className="py-3 text-slate-600">{st.Grade}</td>
                      <td className="py-3 text-slate-500">{st.Email || '-'}</td>
                      <td className="py-3">
                        <span className="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded text-[11px] font-medium">
                          {st.AllowedCourses || 'ทั้งหมด'}
                        </span>
                      </td>
                      <td className="py-3 text-right">
                        <button
                          onClick={() => {
                            Swal.fire({
                              title: 'ลบนักเรียนคนนี้?',
                              text: `รหัส ${st.StudentID} (${st.Name})`,
                              icon: 'warning',
                              showCancelButton: true,
                              confirmButtonColor: '#ef4444'
                            }).then(res => {
                              if (res.isConfirmed) onDeleteStudent(st.StudentID);
                            });
                          }}
                          className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition"
                        >
                          <Icon name="Trash2" size={15} />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function SettingsView({ settings, onSaveSetting }) {
      const currentAnnSetting = settings.find(s => s.SettingKey === 'Announcement');
      let annData = { enabled: true, title: '', content: '', badge: 'ประกาศโรงเรียน' };
      if (currentAnnSetting && currentAnnSetting.SettingValueJSON) {
        try {
          annData = JSON.parse(currentAnnSetting.SettingValueJSON);
        } catch {}
      }

      const [enabled, setEnabled] = useState(annData.enabled ?? true);
      const [title, setTitle] = useState(annData.title || '');
      const [content, setContent] = useState(annData.content || '');
      const [badge, setBadge] = useState(annData.badge || 'ประกาศโรงเรียน');

      const handleSaveAnnouncement = () => {
        const payload = {
          enabled,
          title,
          content,
          badge
        };

        const record = {
          SettingKey: 'Announcement',
          SettingValueJSON: JSON.stringify(payload),
          UpdatedAt: new Date().toISOString()
        };

        onSaveSetting(record);
        Swal.fire({
          icon: 'success',
          title: 'บันทึกประกาศสำเร็จ',
          text: 'ป๊อปอัปจะแสดงผลต่อนักเรียนและครูทุกคนเมื่อเข้าสู่ระบบ',
          timer: 1500,
          showConfirmButton: false
        });
      };

      return (
        <div className="max-w-2xl bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-xs space-y-6">
          <div>
            <h2 className="text-xl font-bold text-slate-900">ตั้งค่าประกาศสำคัญของโรงเรียน (Popup Announcement)</h2>
            <p className="text-xs text-slate-500 mt-1">กำหนดข้อความป๊อปอัปที่จะเด้งเตือนเมื่อผู้ใช้งานทุกคนเปิดเข้าสู่ระบบ</p>
          </div>

          <div className="space-y-4">
            <div className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200">
              <span className="text-xs font-bold text-slate-700">เปิดใช้งานป๊อปอัปประกาศ</span>
              <input
                type="checkbox"
                checked={enabled}
                onChange={(e) => setEnabled(e.target.checked)}
                className="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer"
              />
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">ป้ายกำกับ (Badge)</label>
              <input
                type="text"
                value={badge}
                onChange={(e) => setBadge(e.target.value)}
                className="w-full p-2.5 text-xs border border-slate-200 rounded-xl focus:outline-hidden focus:border-indigo-500"
              />
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">หัวข้อประกาศ</label>
              <input
                type="text"
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                className="w-full p-2.5 text-xs border border-slate-200 rounded-xl focus:outline-hidden focus:border-indigo-500"
              />
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">เนื้อหาประกาศ</label>
              <textarea
                value={content}
                onChange={(e) => setContent(e.target.value)}
                rows="4"
                className="w-full p-2.5 text-xs border border-slate-200 rounded-xl focus:outline-hidden focus:border-indigo-500"
              ></textarea>
            </div>

            <button
              onClick={handleSaveAnnouncement}
              className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-sm transition"
            >
              บันทึกการตั้งค่าประกาศ
            </button>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<EduPortalApp />);
  </script>
</body>
</html>
