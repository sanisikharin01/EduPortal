    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwyVi8My5UYBC6azaOoBsk-uS9PmWd6gmAU-A0CADk2HlEHa3HIWJyas4vGc8Knb2hb/exec';

    function EduPortalApp() {
      // Configuration & Gas URL
      const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('eduportal_gas_url') || DEFAULT_GAS_URL);
      const [isSyncing, setIsSyncing] = useState(false);

      // Current Logged In User State
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('eduportal_current_user');
          return saved ? JSON.parse(saved) : null;
        } catch {
          return null;
        }
      });

      // Active Database Tables State
      const [db, setDb] = useState(() => {
        try {
          const saved = localStorage.getItem('eduportal_db_cache');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error('Failed to load cache:', e);
        }
        return {
          Settings: INITIAL_SETTINGS,
          Teachers: INITIAL_TEACHERS,
          Students: INITIAL_STUDENTS,
          Courses: INITIAL_COURSES,
          Lessons: INITIAL_LESSONS,
          Assignments: INITIAL_ASSIGNMENTS,
          Submissions: INITIAL_SUBMISSIONS,
          Exams: INITIAL_EXAMS,
          ExamAttempts: INITIAL_EXAM_ATTEMPTS,
          Evaluations: INITIAL_EVALUATIONS
        };
      });

      useEffect(() => {
        localStorage.setItem('eduportal_db_cache', JSON.stringify(db));
      }, [db]);

      useEffect(() => {
        const autoFetch = async () => {
          if (!gasUrl || !gasUrl.startsWith('https://script.google.com/')) return;
          setIsSyncing(true);
          try {
            const response = await fetch(gasUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'pullAll', payload: {} })
            });
            const data = await response.json();
            if (data.status === 'success' && data.result && data.result.data) {
              const remote = data.result.data;
              setDb(prev => {
                const next = { ...prev };
                Object.keys(remote).forEach(k => {
                  if (Array.isArray(remote[k]) && remote[k].length > 0) {
                    next[k] = remote[k];
                  }
                });
                return next;
              });
            }
          } catch (err) {
            console.warn('Auto-sync skipped:', err);
          } finally {
            setIsSyncing(false);
          }
        };
        autoFetch();
      }, [gasUrl]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('eduportal_current_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('eduportal_current_user');
        }
      }, [currentUser]);

      const [currentTab, setCurrentTab] = useState('courses');
      const [selectedCourseId, setSelectedCourseId] = useState(null);
      const [takingExam, setTakingExam] = useState(null);
      const [showAnnouncement, setShowAnnouncement] = useState(false);

      const currentAnnouncement = useMemo(() => {
        const item = db.Settings?.find(s => s.SettingKey === 'Announcement');
        if (item && item.SettingValueJSON) {
          try { return JSON.parse(item.SettingValueJSON); } catch { return null; }
        }
        return null;
      }, [db.Settings]);

      useEffect(() => {
        if (currentUser && currentAnnouncement && currentAnnouncement.enabled) {
          const hasSeen = sessionStorage.getItem('eduportal_seen_announcement');
          if (!hasSeen) {
            setShowAnnouncement(true);
            sessionStorage.setItem('eduportal_seen_announcement', 'true');
          }
        }
      }, [currentUser, currentAnnouncement]);

      const callGasApi = async (action, payload = {}) => {
        if (!gasUrl || !gasUrl.startsWith('https://script.google.com/')) {
          Swal.fire({
            icon: 'warning',
            title: 'ยังไม่ได้ระบุ GAS Web App URL',
            text: 'กรุณาใส่ Web App URL ของ Google Apps Script',
            confirmButtonColor: '#4f46e5'
          });
          return null;
        }

        setIsSyncing(true);
        try {
          const response = await fetch(gasUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, payload })
          });
          const data = await response.json();
          if (data.status === 'error') throw new Error(data.message || 'API error');
          return data.result;
        } catch (error) {
          console.error('GAS API Call failed:', error);
          Swal.fire({
            icon: 'error',
            title: 'การเชื่อมต่อผิดพลาด',
            text: error.message || 'ไม่สามารถติดต่อ Google Apps Script ได้',
            confirmButtonColor: '#ef4444'
          });
          return null;
        } finally {
          setIsSyncing(false);
        }
      };

      const handlePingGAS = async () => {
        const res = await callGasApi('ping');
        if (res && res.success) {
          Swal.fire({ icon: 'success', title: 'เชื่อมต่อสำเร็จ! (Online)', text: res.message, confirmButtonColor: '#4f46e5' });
        }
      };

      const handleSetupDatabase = async () => {
        const confirm = await Swal.fire({
          title: 'สร้างและจัดระเบียบ 10 ชีต?',
          text: 'ระบบจะสั่งให้ Code.gs สร้าง 10 Sheet หลักพร้อมจัดหัวตารางอัตโนมัติ',
          icon: 'question',
          showCancelButton: true,
          confirmButtonText: 'ยืนยัน',
          cancelButtonText: 'ยกเลิก',
          confirmButtonColor: '#4f46e5'
        });
        if (confirm.isConfirmed) {
          const res = await callGasApi('setup');
          if (res && res.success) {
            Swal.fire({ icon: 'success', title: 'สร้างตารางสำเร็จ!', text: res.message, confirmButtonColor: '#4f46e5' });
          }
        }
      };

      const handlePullData = async () => {
        const res = await callGasApi('pullAll');
        if (res && res.data) {
          setDb(prev => ({ ...prev, ...res.data }));
          Swal.fire({ icon: 'success', title: 'ดึงข้อมูลสำเร็จ', timer: 1500, showConfirmButton: false });
        }
      };

      const handlePushData = async () => {
        const confirm = await Swal.fire({
          title: 'ส่งข้อมูลทั้งหมดขึ้น Sheets?',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'ยืนยัน',
          cancelButtonText: 'ยกเลิก',
          confirmButtonColor: '#4f46e5'
        });
        if (confirm.isConfirmed) {
          const res = await callGasApi('pushAll', db);
          if (res && res.success) {
            Swal.fire({ icon: 'success', title: 'ส่งข้อมูลสำเร็จ', confirmButtonColor: '#4f46e5' });
          }
        }
      };

      const saveRecordToSheet = async (sheetName, recordData) => {
        const idKey = sheetName === 'Students' ? 'StudentID' :
                      sheetName === 'Teachers' ? 'TeacherID' :
                      sheetName === 'Courses' ? 'CourseID' :
                      sheetName === 'Lessons' ? 'LessonID' :
                      sheetName === 'Assignments' ? 'AssignmentID' :
                      sheetName === 'Exams' ? 'ExamID' :
                      sheetName === 'ExamAttempts' ? 'AttemptID' :
                      sheetName === 'Settings' ? 'SettingKey' : 'ID';

        setDb(prev => {
          const table = prev[sheetName] || [];
          const idx = table.findIndex(item => item[idKey] === recordData[idKey]);
          let updated;
          if (idx >= 0) {
            updated = [...table];
            updated[idx] = { ...updated[idx], ...recordData };
          } else {
            updated = [...table, recordData];
          }
          return { ...prev, [sheetName]: updated };
        });

        if (gasUrl) {
          await callGasApi('saveRecord', { sheetName, data: recordData });
        }
      };

      const deleteRecordFromSheet = async (sheetName, primaryValue) => {
        const idKey = sheetName === 'Students' ? 'StudentID' :
                      sheetName === 'Teachers' ? 'TeacherID' :
                      sheetName === 'Courses' ? 'CourseID' :
                      sheetName === 'Lessons' ? 'LessonID' :
                      sheetName === 'Assignments' ? 'AssignmentID' :
                      sheetName === 'Exams' ? 'ExamID' :
                      sheetName === 'ExamAttempts' ? 'AttemptID' :
                      sheetName === 'Settings' ? 'SettingKey' : 'ID';

        setDb(prev => {
          const table = prev[sheetName] || [];
          return { ...prev, [sheetName]: table.filter(item => item[idKey] !== primaryValue) };
        });

        if (gasUrl) {
          await callGasApi('deleteRecord', { sheetName, primaryValue });
        }
      };

      // IF NOT LOGGED IN, RENDER LOGIN SCREEN (Safe from hook mismatch)
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-slate-900 to-slate-950 flex flex-col items-center justify-center p-4">
            <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
              <div className="text-center mb-8">
                <div className="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white mx-auto shadow-lg shadow-indigo-500/30 mb-4">
                  <Icon name="GraduationCap" size={36} />
                </div>
                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">EduPortal LMS</h1>
                <p className="text-slate-500 text-sm mt-1">ระบบจัดการเรียนการสอนออนไลน์สำหรับโรงเรียน</p>
              </div>

              <LoginForm db={db} onLogin={(role, user) => setCurrentUser({ role, user })} />
            </div>
            <p className="text-slate-400 text-xs mt-6 text-center">Powered by Google Apps Script + Google Sheets</p>
          </div>
        );
      }

      const visibleCourses = useMemo(() => {
        if (currentUser.role === 'admin') return db.Courses || [];
        if (currentUser.role === 'teacher') {
          return (db.Courses || []).filter(c => c.TeacherID === currentUser.user.TeacherID);
        }
        if (currentUser.role === 'student') {
          const allowedList = (currentUser.user.AllowedCourses || '').split(',').map(s => s.trim());
          return (db.Courses || []).filter(c => allowedList.includes(c.CourseID));
        }
        return [];
      }, [currentUser, db.Courses]);

      const activeCourse = useMemo(() => {
        return (db.Courses || []).find(c => c.CourseID === selectedCourseId) || visibleCourses[0] || null;
      }, [db.Courses, visibleCourses, selectedCourseId]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {showAnnouncement && currentAnnouncement && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl border p-6 text-center">
                <div className="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                  <Icon name="Bell" size={32} />
                </div>
                <span className="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 font-semibold text-xs rounded-full mb-3">
                  {currentAnnouncement.badge || 'ประกาศโรงเรียน'}
                </span>
                <h3 className="text-xl font-bold text-slate-800 mb-2">{currentAnnouncement.title}</h3>
                <p className="text-slate-600 text-sm mb-6 text-left bg-slate-50 p-4 rounded-xl">{currentAnnouncement.content}</p>
                <button
                  onClick={() => setShowAnnouncement(false)}
                  className="w-full py-2.5 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition"
                >
                  รับทราบ
                </button>
              </div>
            </div>
          )}

          {currentUser.role === 'admin' && (
            <AdminControlBar 
              gasUrl={gasUrl}
              setGasUrl={(url) => { setGasUrl(url); localStorage.setItem('eduportal_gas_url', url); }}
              isSyncing={isSyncing}
              onPing={handlePingGAS}
              onSetup={handleSetupDatabase}
              onPull={handlePullData}
              onPush={handlePushData}
            />
          )}

          <header className="bg-white border-b sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md">
                  <Icon name="GraduationCap" size={24} />
                </div>
                <div>
                  <span className="font-bold text-lg text-slate-900 block leading-tight">EduPortal</span>
                  <span className="text-[11px] text-slate-500 font-medium">Smart Online LMS</span>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="text-right hidden sm:block">
                  <div className="text-sm font-semibold text-slate-800 leading-tight">
                    {currentUser.role === 'admin' ? 'ผู้ดูแลระบบ (Admin)' : currentUser.user.Name}
                  </div>
                  <div className="text-xs text-indigo-600 font-medium">
                    {currentUser.role === 'admin' && 'System Administrator'}
                    {currentUser.role === 'teacher' && `ครูผู้สอน • ${currentUser.user.Department || 'วิชาการ'}`}
                    {currentUser.role === 'student' && `รหัสนักเรียน: ${currentUser.user.StudentID} (${currentUser.user.Grade})`}
                  </div>
                </div>

                <div className="w-10 h-10 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center font-bold border">
                  {currentUser.role === 'admin' ? <Icon name="Shield" size={20} className="text-indigo-600" /> :
                   currentUser.role === 'teacher' ? <Icon name="BookOpen" size={20} className="text-emerald-600" /> :
                   <Icon name="GraduationCap" size={20} className="text-amber-600" />}
                </div>

                <button
                  onClick={() => {
                    Swal.fire({
                      title: 'ออกจากระบบ?',
                      icon: 'question',
                      showCancelButton: true,
                      confirmButtonText: 'ออกจากระบบ',
                      cancelButtonText: 'ยกเลิก',
                      confirmButtonColor: '#ef4444'
                    }).then(res => {
                      if (res.isConfirmed) {
                        setCurrentUser(null);
                        setSelectedCourseId(null);
                        setTakingExam(null);
                      }
                    });
                  }}
                  className="p-2 text-slate-400 hover:text-rose-600 rounded-lg transition"
                >
                  <Icon name="LogOut" size={20} />
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {takingExam ? (
              <ExamTakingView 
                exam={takingExam}
                student={currentUser.user}
                onComplete={async (resultRecord) => {
                  await saveRecordToSheet('ExamAttempts', resultRecord);
                  setTakingExam(null);
                  setCurrentTab('exams');
                  Swal.fire({ icon: 'success', title: 'ส่งคำตอบเรียบร้อย!', html: `คะแนนของคุณคือ <b>${resultRecord.Score} / ${resultRecord.TotalScore}</b> คะแนน`, confirmButtonColor: '#4f46e5' });
                }}
                onCancel={() => setTakingExam(null)}
              />
            ) : (
              <div>
                <div className="flex border-b border-slate-200 mb-6 gap-2 overflow-x-auto pb-1">
                  <TabButton active={currentTab === 'courses'} onClick={() => setCurrentTab('courses')} icon="BookOpen" label="รายวิชาเรียน" />
                  {activeCourse && (
                    <>
                      <TabButton active={currentTab === 'lessons'} onClick={() => setCurrentTab('lessons')} icon="Video" label="บทเรียน & สื่อ" />
                      <TabButton active={currentTab === 'assignments'} onClick={() => setCurrentTab('assignments')} icon="FileText" label="การบ้าน & งาน" />
                      <TabButton active={currentTab === 'exams'} onClick={() => setCurrentTab('exams')} icon="Clock" label="แบบทดสอบออนไลน์" />
                      <TabButton active={currentTab === 'evaluations'} onClick={() => setCurrentTab('evaluations')} icon="Star" label="แบบประเมินครู" />
                    </>
                  )}
                  {currentUser.role === 'admin' && (
                    <>
                      <TabButton active={currentTab === 'students'} onClick={() => setCurrentTab('students')} icon="Users" label="จัดการนักเรียน (CSV)" />
                      <TabButton active={currentTab === 'teachers'} onClick={() => setCurrentTab('teachers')} icon="UserCheck" label="จัดการครูผู้สอน" />
                      <TabButton active={currentTab === 'settings'} onClick={() => setCurrentTab('settings')} icon="Bell" label="ตั้งค่าประกาศ" />
                    </>
                  )}
                </div>

                {currentTab === 'courses' && (
                  <CoursesView 
                    courses={visibleCourses} 
                    allTeachers={db.Teachers || []}
                    currentUser={currentUser} 
                    selectedCourseId={activeCourse?.CourseID}
                    onSelectCourse={(id) => { setSelectedCourseId(id); setCurrentTab('lessons'); }}
                    onSaveCourse={(c) => saveRecordToSheet('Courses', c)}
                    onDeleteCourse={(id) => deleteRecordFromSheet('Courses', id)}
                  />
                )}

                {currentTab === 'lessons' && activeCourse && (
                  <LessonsView 
                    course={activeCourse} 
                    lessons={(db.Lessons || []).filter(l => l.CourseID === activeCourse.CourseID)}
                    currentUser={currentUser}
                    onSaveLesson={(lesson) => saveRecordToSheet('Lessons', lesson)}
                    onDeleteLesson={(id) => deleteRecordFromSheet('Lessons', id)}
                  />
                )}

                {currentTab === 'assignments' && activeCourse && (
                  <AssignmentsView 
                    course={activeCourse}
                    assignments={(db.Assignments || []).filter(a => a.CourseID === activeCourse.CourseID)}
                    submissions={(db.Submissions || []).filter(s => s.CourseID === activeCourse.CourseID)}
                    currentUser={currentUser}
                    gasUrl={gasUrl}
                    callGasApi={callGasApi}
                    onSaveAssignment={(a) => saveRecordToSheet('Assignments', a)}
                    onDeleteAssignment={(id) => deleteRecordFromSheet('Assignments', id)}
                    onSaveSubmission={(s) => saveRecordToSheet('Submissions', s)}
                  />
                )}

                {currentTab === 'exams' && activeCourse && (
                  <ExamsView 
                    course={activeCourse}
                    exams={(db.Exams || []).filter(e => e.CourseID === activeCourse.CourseID)}
                    attempts={(db.ExamAttempts || []).filter(att => att.CourseID === activeCourse.CourseID)}
                    currentUser={currentUser}
                    onStartExam={(exam) => setTakingExam(exam)}
                    onSaveExam={(exam) => saveRecordToSheet('Exams', exam)}
                    onDeleteExam={(id) => deleteRecordFromSheet('Exams', id)}
                  />
                )}

                {currentTab === 'evaluations' && activeCourse && (
                  <EvaluationsView 
                    course={activeCourse}
                    evaluations={(db.Evaluations || []).filter(ev => ev.CourseID === activeCourse.CourseID)}
                    currentUser={currentUser}
                    onSaveEvaluation={(ev) => saveRecordToSheet('Evaluations', ev)}
                  />
                )}

                {currentTab === 'students' && currentUser.role === 'admin' && (
                  <StudentsManagementView 
                    students={db.Students || []}
                    courses={db.Courses || []}
                    gasUrl={gasUrl}
                    callGasApi={callGasApi}
                    onSaveStudent={(st) => saveRecordToSheet('Students', st)}
                    onDeleteStudent={(id) => deleteRecordFromSheet('Students', id)}
                    onBatchImportSuccess={(newStudents) => {
                      setDb(prev => ({
                        ...prev,
                        Students: [...(prev.Students || []).filter(s => !newStudents.some(ns => ns.StudentID === s.StudentID)), ...newStudents]
                      }));
                    }}
                  />
                )}

                {currentTab === 'teachers' && currentUser.role === 'admin' && (
                  <TeachersManagementView 
                    teachers={db.Teachers || []}
                    onSaveTeacher={(t) => saveRecordToSheet('Teachers', t)}
                    onDeleteTeacher={(id) => deleteRecordFromSheet('Teachers', id)}
                  />
                )}

                {currentTab === 'settings' && currentUser.role === 'admin' && (
                  <SettingsView settings={db.Settings || []} onSaveSetting={(st) => saveRecordToSheet('Settings', st)} />
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    function TabButton({ active, onClick, icon, label }) {
      return (
        <button
          onClick={onClick}
          className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm transition whitespace-nowrap ${
            active ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
          }`}
        >
          <Icon name={icon} size={18} />
          <span>{label}</span>
        </button>
      );
    }

    function AdminControlBar({ gasUrl, setGasUrl, isSyncing, onPing, onSetup, onPull, onPush }) {
      const [isOpen, setIsOpen] = useState(false);
      const [localUrl, setLocalUrl] = useState(gasUrl);

      return (
        <div className="bg-slate-900 text-white border-b border-slate-800 text-xs">
          <div className="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
              <span className="font-semibold">แผงควบคุมฐานข้อมูล (Admin Backend)</span>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <button onClick={() => setIsOpen(!isOpen)} className="px-2.5 py-1 bg-slate-800 rounded-md border border-slate-700">
                {isOpen ? 'ปิดช่องตั้งค่า URL' : 'ตั้งค่า Web App URL'}
              </button>
              <button onClick={onPing} disabled={isSyncing} className="px-2.5 py-1 bg-indigo-600 rounded-md font-medium">Ping Test</button>
              <button onClick={onSetup} disabled={isSyncing} className="px-2.5 py-1 bg-slate-800 text-amber-300 rounded-md border">สร้าง 10 Sheet</button>
              <button onClick={onPull} disabled={isSyncing} className="px-2.5 py-1 bg-sky-600 rounded-md">ดึงข้อมูล (Pull)</button>
              <button onClick={onPush} disabled={isSyncing} className="px-2.5 py-1 bg-emerald-600 rounded-md">ส่งข้อมูล (Push)</button>
            </div>
          </div>
          {isOpen && (
            <div className="max-w-7xl mx-auto px-4 py-3 border-t border-slate-800 bg-slate-950 flex gap-2">
              <input
                type="text"
                value={localUrl}
                onChange={(e) => setLocalUrl(e.target.value)}
                placeholder="วาง GAS Web App URL ที่นี่"
                className="flex-1 bg-slate-900 text-slate-100 px-3 py-1 rounded border border-slate-700 text-xs"
              />
              <button onClick={() => { setGasUrl(localUrl); Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1200, showConfirmButton: false }); }} className="px-4 py-1 bg-indigo-600 rounded text-xs">บันทึก</button>
            </div>
          )}
        </div>
      );
    }

    function LoginForm({ db, onLogin }) {
      const [role, setRole] = useState('student');
      const [studentId, setStudentId] = useState('');
      const [pin, setPin] = useState('');
      const [teacherEmail, setTeacherEmail] = useState('');
      const [teacherPassword, setTeacherPassword] = useState('');
      const [adminPassword, setAdminPassword] = useState('');

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (role === 'student') {
          const student = (db.Students || []).find(s => s.StudentID === studentId.trim());
          if (!student) {
            Swal.fire({ icon: 'error', title: 'ไม่พบรหัสนักเรียน', confirmButtonColor: '#ef4444' });
            return;
          }
          if (student.PIN && student.PIN !== pin.trim()) {
            Swal.fire({ icon: 'error', title: 'รหัส PIN ไม่ถูกต้อง', confirmButtonColor: '#ef4444' });
            return;
          }
          onLogin('student', student);
        } else if (role === 'teacher') {
          const teacher = (db.Teachers || []).find(t => t.Email.toLowerCase() === teacherEmail.trim().toLowerCase());
          if (!teacher || teacher.Password !== teacherPassword) {
            Swal.fire({ icon: 'error', title: 'อีเมลหรือรหัสผ่านครูไม่ถูกต้อง', confirmButtonColor: '#ef4444' });
            return;
          }
          onLogin('teacher', teacher);
        } else if (role === 'admin') {
          const adminSetting = (db.Settings || []).find(s => s.SettingKey === 'AdminPassword');
          let validPass = 'admin1234';
          if (adminSetting && adminSetting.SettingValueJSON) {
            try { validPass = JSON.parse(adminSetting.SettingValueJSON); } catch { validPass = adminSetting.SettingValueJSON; }
          }
          if (adminPassword !== validPass) {
            Swal.fire({ icon: 'error', title: 'รหัสผ่าน Admin ไม่ถูกต้อง', confirmButtonColor: '#ef4444' });
            return;
          }
          onLogin('admin', { Name: 'ผู้ดูแลระบบสูงสุด' });
        }
      };

      return (
        <div>
          <div className="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-2xl mb-6">
            <button type="button" onClick={() => setRole('student')} className={`py-2 text-xs font-semibold rounded-xl ${role === 'student' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600'}`}>นักเรียน</button>
            <button type="button" onClick={() => setRole('teacher')} className={`py-2 text-xs font-semibold rounded-xl ${role === 'teacher' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600'}`}>ครูผู้สอน</button>
            <button type="button" onClick={() => setRole('admin')} className={`py-2 text-xs font-semibold rounded-xl ${role === 'admin' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600'}`}>ผู้ดูแล</button>
          </div>

          <form onSubmit={handleLoginSubmit} className="space-y-4">
            {role === 'student' && (
              <>
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">รหัสนักเรียน</label>
                  <input type="text" required placeholder="04501" value={studentId} onChange={(e) => setStudentId(e.target.value)} className="w-full px-4 py-2.5 text-sm bg-slate-50 border rounded-xl" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">รหัส PIN (4 หลัก)</label>
                  <input type="password" placeholder="1234" value={pin} onChange={(e) => setPin(e.target.value)} className="w-full px-4 py-2.5 text-sm bg-slate-50 border rounded-xl" />
                </div>
              </>
            )}

            {role === 'teacher' && (
              <>
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">อีเมลครู</label>
                  <input type="email" required placeholder="somsak@school.ac.th" value={teacherEmail} onChange={(e) => setTeacherEmail(e.target.value)} className="w-full px-4 py-2.5 text-sm bg-slate-50 border rounded-xl" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">รหัสผ่าน</label>
                  <input type="password" required placeholder="123" value={teacherPassword} onChange={(e) => setTeacherPassword(e.target.value)} className="w-full px-4 py-2.5 text-sm bg-slate-50 border rounded-xl" />
                </div>
              </>
            )}

            {role === 'admin' && (
              <div>
                <label className="block text-xs font-medium text-slate-700 mb-1">รหัสผ่านผู้ดูแลระบบ</label>
                <input type="password" required placeholder="admin1234" value={adminPassword} onChange={(e) => setAdminPassword(e.target.value)} className="w-full px-4 py-2.5 text-sm bg-slate-50 border rounded-xl" />
              </div>
            )}

            <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-md transition mt-2">
              เข้าสู่ระบบ
            </button>
          </form>
          <div className="mt-6 pt-4 border-t text-[11px] text-slate-500 text-center space-y-1">
            <p>นักเรียน: รหัส <code>04501</code> PIN: <code>1234</code></p>
            <p>ครู: <code>somsak@school.ac.th</code> รหัส: <code>123</code></p>
          </div>
        </div>
      );
    }

    function CoursesView({ courses, allTeachers, currentUser, selectedCourseId, onSelectCourse, onSaveCourse, onDeleteCourse }) {
      const handleOpenCourseModal = async (existingCourse = null) => {
        const isEdit = !!existingCourse;

          { label: 'ม่วง-ชมพู', val: 'from-purple-600 to-pink-600' }

              <input id="swal-name" class="w-full p-2 border rounded-lg" value="${existingCourse?.Name || ''}">
              <div class="grid grid-cols-3 gap-2">

                <div><label class="font-bold block">เทอม</label><input id="swal-term" class="w-full p-2 border rounded-lg" value="${existingCourse?.Term || '1/2569'}"></div>
                <div><label class="font-bold block">หน่วยกิต</label><input id="swal-credits" class="w-full p-2 border rounded-lg" value="${existingCourse?.Credits || '1.5'}"></div>
              </div>
              ${currentUser.role === 'admin' ? `<label class="font-bold block">ครูผู้สอน</label><select id="swal-teacher" class="w-full p-2 border rounded-lg bg-white">${teacherOptions}</select>` : ''}
              <label class="font-bold block">ธีมสีปก</label>
              <select id="swal-color" class="w-full p-2 border rounded-lg bg-white">${coverOptions}</select>
            </div>
          `,
          showCancelButton: true,
          confirmButtonText: 'บันทึก',
          cancelButtonText: 'ยกเลิก',
          confirmButtonColor: '#4f46e5',
          preConfirm: () => {
            const code = document.getElementById('swal-code').value.trim();
            const name = document.getElementById('swal-name').value.trim();
            if (!code || !name) { Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบ'); return false; }
            return {
              code, name,
              gradeLevel: document.getElementById('swal-grade').value.trim(),
              term: document.getElementById('swal-term').value.trim(),
              credits: document.getElementById('swal-credits').value.trim(),
              coverColor: document.getElementById('swal-color').value,
              selectedTeacherId: currentUser.role === 'admin' ? document.getElementById('swal-teacher').value : currentUser.user.TeacherID
            };
          }
        });

        if (formValues) {
          const matchedTeacher = allTeachers.find(t => t.TeacherID === formValues.selectedTeacherId);
          onSaveCourse({
            CourseID: existingCourse ? existingCourse.CourseID : ('C_' + Date.now().toString().slice(-6)),
            Code: formValues.code,
            Name: formValues.name,
            TeacherID: formValues.selectedTeacherId,
            TeacherName: matchedTeacher ? matchedTeacher.Name : currentUser.user.Name,
            GradeLevel: formValues.gradeLevel,
            Term: formValues.term,
            Credits: formValues.credits,
            CoverColor: formValues.coverColor,
            CreatedAt: existingCourse ? existingCourse.CreatedAt : new Date().toISOString().split('T')[0]
          });
          Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1200, showConfirmButton: false });
        }
      };

      return (
        <div>
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-xl font-bold">รายวิชาเรียนทั้งหมด</h2>
            {(currentUser.role === 'admin' || currentUser.role === 'teacher') && (
              <button onClick={() => handleOpenCourseModal(null)} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium shadow-sm">เพิ่มรายวิชา</button>
            )}
          </div>
          {courses.length === 0 ? (
            <div className="bg-white rounded-2xl p-12 text-center border">ไม่มีรายวิชา</div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {courses.map(course => (
                <div key={course.CourseID} onClick={() => onSelectCourse(course.CourseID)} className={`bg-white rounded-2xl border overflow-hidden shadow-xs cursor-pointer flex flex-col ${selectedCourseId === course.CourseID ? 'ring-2 ring-indigo-500' : ''}`}>
                  <div className={`h-28 bg-gradient-to-r ${course.CoverColor || 'from-indigo-600 to-blue-700'} p-5 text-white flex flex-col justify-between`}>
                    <span className="bg-white/20 text-xs px-2.5 py-0.5 rounded-full w-fit">{course.Code}</span>
                    <h3 className="font-bold text-lg">{course.Name}</h3>
                  </div>
                  <div className="p-5 flex-1 flex flex-col justify-between">
                    <p className="text-xs text-slate-600 mb-4">ครูผู้สอน: {course.TeacherName}</p>
                    <div className="pt-3 border-t flex justify-between items-center text-xs font-semibold text-indigo-600">
                      <span>เข้าสู่บทเรียน</span>
                      {(currentUser.role === 'admin' || currentUser.role === 'teacher') && (
                        <div className="flex gap-1" onClick={e => e.stopPropagation()}>
                          <button onClick={() => handleOpenCourseModal(course)} className="p-1 text-slate-400 hover:text-indigo-600"><Icon name="Edit" size={15} /></button>
                          <button onClick={() => onDeleteCourse(course.CourseID)} className="p-1 text-slate-400 hover:text-rose-600"><Icon name="Trash2" size={15} /></button>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function LessonsView({ course, lessons, currentUser, onSaveLesson, onDeleteLesson }) {
      const [activeVideoId, setActiveVideoId] = useState(null);
      const visibleLessons = currentUser.role === 'student' ? lessons.filter(l => String(l.Published) !== 'false') : lessons;

      const getEmbedUrl = (url) => {
        if (!url) return null;
        const yt = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
        if (yt && yt[1]) return `https://www.youtube.com/embed/${yt[1]}`;
        return null;
      };

      return (
        <div className="space-y-6">
          <h2 className="text-xl font-bold">บทเรียน & สื่อการสอน</h2>
          {visibleLessons.length === 0 ? <div className="bg-white p-12 text-center rounded-2xl border">ไม่มีบทเรียน</div> : (
            visibleLessons.map(lesson => (
              <div key={lesson.LessonID} className="bg-white p-6 rounded-2xl border space-y-3">
                <h3 className="font-bold text-base">{lesson.Title}</h3>
                <p className="text-slate-600 text-sm whitespace-pre-line">{lesson.Description}</p>
                {lesson.VideoURL && (
                  <button onClick={() => setActiveVideoId(activeVideoId === lesson.LessonID ? null : lesson.LessonID)} className="px-3 py-1 bg-indigo-600 text-white rounded text-xs">
                    {activeVideoId === lesson.LessonID ? 'ซ่อนวิดีโอ' : 'เล่นวิดีโอ'}
                  </button>
                )}
                {activeVideoId === lesson.LessonID && getEmbedUrl(lesson.VideoURL) && (
                  <iframe src={getEmbedUrl(lesson.VideoURL)} className="w-full aspect-video rounded-xl" allowFullScreen></iframe>
                )}
              </div>
            ))
          )}
        </div>
      );
    }

    function AssignmentsView({ course, assignments, submissions, currentUser, gasUrl, callGasApi, onSaveAssignment, onDeleteAssignment, onSaveSubmission }) {
      return (
        <div className="space-y-6">
          <h2 className="text-xl font-bold">การบ้านและใบงาน</h2>
          {assignments.length === 0 ? <div className="bg-white p-12 text-center rounded-2xl border">ไม่มีการบ้าน</div> : (
            assignments.map(assign => (
              <div key={assign.AssignmentID} className="bg-white p-6 rounded-2xl border">
                <h3 className="font-bold text-lg">{assign.Title}</h3>
                <p className="text-slate-600 text-sm mt-1">{assign.Description}</p>
              </div>
            ))
          )}
        </div>
      );
    }

    function ExamsView({ course, exams, attempts, currentUser, onStartExam, onSaveExam, onDeleteExam }) {
      return (
        <div className="space-y-6">
          <h2 className="text-xl font-bold">แบบทดสอบออนไลน์</h2>
          {exams.length === 0 ? <div className="bg-white p-12 text-center rounded-2xl border">ไม่มีแบบทดสอบ</div> : (
            exams.map(exam => (
              <div key={exam.ExamID} className="bg-white p-6 rounded-2xl border flex justify-between items-center">
                <div>
                  <h3 className="font-bold text-lg">{exam.Title}</h3>
                  <p className="text-slate-600 text-sm">{exam.Description}</p>
                </div>
                {currentUser.role === 'student' && (
                  <button onClick={() => onStartExam(exam)} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">เริ่มทำข้อสอบ</button>
                )}
              </div>
            ))
          )}
        </div>
      );
    }

    function ExamTakingView({ exam, student, onComplete, onCancel }) {
      const questions = useMemo(() => { try { return JSON.parse(exam.QuestionsJSON || '[]'); } catch { return []; } }, [exam]);
      const [answers, setAnswers] = useState({});

      const handleSubmit = () => {
        let score = 0, total = 0;
        questions.forEach((q, idx) => {
          total += (parseInt(q.score) || 5);
          if (answers[idx] === q.answerIndex) score += (parseInt(q.score) || 5);
        });
        onComplete({
          AttemptID: 'ATT_' + Date.now().toString().slice(-6),
          ExamID: exam.ExamID,
          CourseID: exam.CourseID,
          StudentID: student.StudentID,
          StudentName: student.Name,
          Score: String(score),
          TotalScore: String(total),
          SubmittedAt: new Date().toLocaleString('th-TH'),
          TimeSpentSec: '120'
        });
      };

      return (
        <div className="max-w-3xl mx-auto bg-white rounded-3xl p-8 border shadow-md space-y-6">
          <h2 className="text-xl font-bold">{exam.Title}</h2>
          {questions.map((q, qIdx) => (
            <div key={qIdx} className="space-y-2">
              <p className="font-bold text-sm">{qIdx + 1}. {q.text}</p>
              <div className="space-y-1 pl-4">
                {q.options.map((opt, optIdx) => (
                  <label key={optIdx} className="flex gap-2 text-xs cursor-pointer">
                    <input type="radio" name={`q_${qIdx}`} checked={answers[qIdx] === optIdx} onChange={() => setAnswers({ ...answers, [qIdx]: optIdx })} />
                    <span>{opt}</span>
                  </label>
                ))}
              </div>
            </div>
          ))}
          <div className="flex justify-between pt-4 border-t">
            <button onClick={onCancel} className="text-xs text-slate-500">ยกเลิก</button>
            <button onClick={handleSubmit} className="px-6 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">ส่งคำตอบ</button>
          </div>
        </div>
      );
    }

    function EvaluationsView({ course, evaluations, currentUser, onSaveEvaluation }) {
      return <div className="bg-white p-8 rounded-2xl border"><h2 className="text-xl font-bold">แบบประเมินครูผู้สอน</h2></div>;
    }

    function StudentsManagementView({ students, courses, gasUrl, callGasApi, onSaveStudent, onDeleteStudent, onBatchImportSuccess }) {
      return <div className="bg-white p-8 rounded-2xl border"><h2 className="text-xl font-bold">จัดการข้อมูลนักเรียน</h2></div>;
    }

    function TeachersManagementView({ teachers, onSaveTeacher, onDeleteTeacher }) {
      return <div className="bg-white p-8 rounded-2xl border"><h2 className="text-xl font-bold">จัดการครูผู้สอน</h2></div>;
    }

    function SettingsView({ settings, onSaveSetting }) {
      return <div className="bg-white p-8 rounded-2xl border"><h2 className="text-xl font-bold">ตั้งค่าระบบ</h2></div>;
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<EduPortalApp />);
  </script>
</body>
</html>
